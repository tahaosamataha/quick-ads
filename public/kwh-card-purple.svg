<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Purple Brand Card (تايو 1 - خد و هات) -->
  <rect width="400" height="400" rx="32" fill="#482878"/>
  
  <g fill="#F5B800" transform="translate(40, 90)">
    <!-- Smile Icon placed dynamically -->
    <g transform="translate(18, 0) scale(0.68)">
      <ellipse cx="80" cy="58" rx="16" ry="22" transform="rotate(-10 80 58)"/>
      <path d="M 104 43 A 42 42 0 0 1 138 48 L 131 70 A 26 26 0 0 0 107 66 Z"/>
      <path d="M 28 116 L 53 108 A 62 62 0 0 0 148 84 L 172 76 A 88 88 0 0 1 28 116 Z"/>
    </g>
    
    <!-- Arabic Typography for "خد وهات" -->
    <text x="160" y="145" font-family="'Alexandria', 'Cairo', sans-serif" font-weight="900" font-size="62" text-anchor="middle" letter-spacing="-1">خد وهات</text>
    
    <!-- Registered Mark -->
    <circle cx="20" cy="140" r="8" fill="none" stroke="#F5B800" stroke-width="2"/>
    <text x="20" y="143" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#F5B800">R</text>
  </g>
</svg>
